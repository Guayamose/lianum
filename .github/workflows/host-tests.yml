name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install verified Node runtime
        run: python3 scripts/development/prepare-host-runtime.py
      - name: Build workspace and verify versioned originals
        run: |
          ./dev build
          python3 scripts/development/verify_layout.py --tracked-delivery
          python3 scripts/development/test_workspace.py
          python3 scripts/development/test_doctor.py
      - name: Run the default host selection
        run: ./dev test
      - name: Verify new DeFi and laboratory regressions on the host
        run: |
          ./dev test packages/backend/tests/defi/withdrawals/private-vault-exit.test.mjs tests/integration/chains/solana tests/integration/wallet/manual/manual-wallet-app-driver.test.mjs
