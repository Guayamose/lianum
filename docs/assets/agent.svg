<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="662" viewBox="0 0 1280 662" role="img" aria-labelledby="title desc"><title id="title">Persistent agent and bounded context</title><desc id="desc">Full owner-scoped history is stored durably. Each turn selects limited preferences, related excerpts, tasks and wallet observations.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#245E9D"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B85D2E"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7260B4"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#658348"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A23F2E"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8C6D1F"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222321"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A6A99C"/></marker></defs><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#DCDCCE" opacity="0.55"/></pattern></defs><rect width="1280" height="662" fill="#FFFCF0"/><rect width="1280" height="662" fill="url(#dots)"/><text x="48" y="42" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#666A60" text-anchor="start" letter-spacing="0.8">PERSISTENT FINANCIAL AGENT</text><text x="48" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="500" fill="#222321" text-anchor="start">A continuous conversation. A bounded working context.</text><text x="48" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Accepted work outlives the mobile request; owner approval remains separate.</text><path d="M320,190 l6,6 v141 l-6,-6 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><path d="M48,331 h272 l6,6 h-272 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><rect x="48" y="190" width="272" height="141" fill="#FBE8D7" stroke="#B85D2E" stroke-width="1.2"/><g transform="translate(77,222) scale(0.65)" fill="none" stroke="#B85D2E" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-20,-16 H20 V8 H-2 L-12,17 V8 H-20 Z M-11,-5 h22 M-11,1 h14"/></g><text x="103" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#B85D2E" text-anchor="start">One conversation</text><text x="68" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Text + streaming responses</text><text x="68" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Voice + saved transcripts</text><path d="M328,260 H379" stroke="#B85D2E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-orange)" marker-end="url(#a-orange)"/><path d="M817,190 l6,6 v141 l-6,-6 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><path d="M385,331 h432 l6,6 h-432 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><rect x="385" y="190" width="432" height="141" fill="#FBE8D7" stroke="#B85D2E" stroke-width="1.2"/><g transform="translate(414,222) scale(0.65)" fill="none" stroke="#B85D2E" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="0" cy="-12" rx="19" ry="7"/><path d="M-19,-12 v24 c0,9 38,9 38,0 v-24 M-19,0 c0,9 38,9 38,0"/></g><text x="440" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#B85D2E" text-anchor="start">Durable service</text><text x="405" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Messages · memory · tasks · outbox</text><text x="405" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Idempotent submission + saved tool results</text><path d="M825,260 H879" stroke="#B85D2E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-orange)" marker-end="url(#a-orange)"/><path d="M1224,190 l6,6 v141 l-6,-6 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><path d="M885,331 h339 l6,6 h-339 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><rect x="885" y="190" width="339" height="141" fill="#FBE8D7" stroke="#B85D2E" stroke-width="1.2"/><g transform="translate(914,222) scale(0.65)" fill="none" stroke="#B85D2E" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-9,-12 L-21,0 -9,12 M9,-12 L21,0 9,12 M4,-18 L-4,18"/></g><text x="940" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#B85D2E" text-anchor="start">Model + tools</text><text x="905" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Wallet reads + supported proposals</text><text x="905" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Owner-scoped session events</text><path d="M62,389 H48 V572 H1224 V389 H452.0" stroke="#222321" stroke-width="1.1" fill="none" stroke-linejoin="round"/><text x="70" y="396.6" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#222321" text-anchor="start">Selected context for each turn</text><path d="M333,425 l6,6 v111 l-6,-6 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><path d="M73,536 h260 l6,6 h-260 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><rect x="73" y="425" width="260" height="111" fill="#FFFCF0" stroke="#A6A99C" stroke-width="1.2"/><text x="93" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#222321" text-anchor="start">Fresh observations</text><text x="93" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Environment + freshness</text><path d="M625,425 l6,6 v111 l-6,-6 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><path d="M365,536 h260 l6,6 h-260 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><rect x="365" y="425" width="260" height="111" fill="#FFFCF0" stroke="#A6A99C" stroke-width="1.2"/><text x="385" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#222321" text-anchor="start">8 preferences</text><text x="385" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Editable owner memory</text><path d="M917,425 l6,6 v111 l-6,-6 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><path d="M657,536 h260 l6,6 h-260 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><rect x="657" y="425" width="260" height="111" fill="#FFFCF0" stroke="#A6A99C" stroke-width="1.2"/><text x="677" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#222321" text-anchor="start">3 history excerpts</text><text x="677" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Owner-scoped history</text><path d="M1209,425 l6,6 v111 l-6,-6 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><path d="M949,536 h260 l6,6 h-260 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><rect x="949" y="425" width="260" height="111" fill="#FFFCF0" stroke="#A6A99C" stroke-width="1.2"/><text x="969" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#222321" text-anchor="start">4 upcoming tasks</text><text x="969" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Requested follow-ups</text><text x="48" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#253746" text-anchor="start">The agent proposes and observes. The phone reviews and signs financial authority.</text></svg>
