<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="678" viewBox="0 0 1280 678" role="img" aria-labelledby="title desc"><title id="title">Lianum deployment boundaries</title><desc id="desc">Phone custody connects through the public API host to a private PAEG host. Agent and proof processes have separate roles.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#245E9D"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B85D2E"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7260B4"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#658348"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A23F2E"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8C6D1F"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222321"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A6A99C"/></marker></defs><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#DCDCCE" opacity="0.55"/></pattern></defs><rect width="1280" height="678" fill="#FFFCF0"/><rect width="1280" height="678" fill="url(#dots)"/><text x="48" y="42" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#666A60" text-anchor="start" letter-spacing="0.8">SYSTEM ARCHITECTURE</text><text x="48" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="500" fill="#222321" text-anchor="start">Custody, coordination, execution.</text><text x="48" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Separate authority boundaries. One connected financial experience.</text><path d="M278,190 l6,6 v175 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M48,365 h230 l6,6 h-230 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><rect x="48" y="190" width="230" height="175" fill="#E5EDED" stroke="#245E9D" stroke-width="1.2"/><g transform="translate(77,222) scale(0.65)" fill="none" stroke="#245E9D" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><circle cx="-8" cy="-7" r="13"/><path d="M2,2 l18,18 M11,11 l6,-6 M16,16 l6,-6"/></g><text x="103" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#245E9D" text-anchor="start">Mobile wallet</text><text x="68" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Keys + biometrics</text><text x="68" y="289" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Portfolio + review</text><text x="68" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Mainnet / Testnet</text><path d="M341,167 H327 V599 H1224 V167 H718.6" s