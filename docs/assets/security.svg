<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="595" viewBox="0 0 1280 595" role="img" aria-labelledby="title desc"><title id="title">Lianum authority and disclosure boundaries</title><desc id="desc">The phone owns financial signatures. The agent, gateway, engine and proof workers have separate capabilities and trust assumptions.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#245E9D"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B85D2E"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7260B4"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#658348"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A23F2E"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8C6D1F"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222321"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A6A99C"/></marker></defs><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#DCDCCE" opacity="0.55"/></pattern></defs><rect width="1280" height="595" fill="#FFFCF0"/><rect width="1280" height="595" fill="url(#dots)"/><text x="48" y="42" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#666A60" text-anchor="start" letter-spacing="0.8">SECURITY AND PRIVACY</text><text x="48" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="500" fill="#222321" text-anchor="start">Useful intelligence. Explicit financial authority.</text><text x="48" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">A proposal, an authorization, an observation and a proof are different capabilities.</text><path d="M267,196 l6,6 v153 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M48,349 h219 l6,6 h-219 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><rect x="48" y="196" width="219" height="153" fill="#E5EDED" stroke="#245E9D" stroke-width="1.2"/><g transform="translate(77,228) scale(0.65)" fill="none" stroke="#245E9D" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><circle cx="-8" cy="-7" r="13"/><path d="M2,2 l18,18 M11,11 l6,-6 M16,16 l6,-6"/></g><text x="103" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#245E9D" text-anchor="start">Phone</text><text x="68" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Review + sign</text><text x="68" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Owner keys</text><path d="M273,268 H282" stroke="#245E9D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M506,196 l6,6 v153 l-6,-6 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><path d="M287,349 h219 l6,6 h-219 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><rect x="287" y="196" width="219" height="153" fill="#FBE8D7" stroke="#B85D2E" stroke-width="1.2"/><g transform="translate(316,228) scale(0.65)" fill="none" stroke="#B85D2E" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-20,-16 H20 V8 H-2 L-12,17 V8 H-20 Z M-11,-5 h22 M-11,1 h14"/></g><text x="342" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#B85D2E" text-anchor="start">Agent</text><text x="307" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Propose + observe</text><text x="307" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">No wallet keys</text><path d="M512,268 H521" stroke="#B85D2E" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/><path d="M745,196 l6,6 v153 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M526,349 h219 l6,6 h-219 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><rect x="526" y="196" width="219" height="153" fill="#E5EDED" stroke="#245E9D" stroke-width="1.2"/><g transform="translate(555,228) scale(0.65)" fill="none" stroke="#245E9D" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-9,-12 L-21,0 -9,12 M9,-12 L21,0 9,12 M4,-18 L-4,18"/></g><text x="581" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#245E9D" text-anchor="start">Gateway</text><text x="546" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Authenticate + route</text><text x="546" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Scoped requests</text><path d="M751,268 H760" stroke="#245E9D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M984,196 l6,6 v153 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M765,349 h219 l6,6 h-219 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><rect x="765" y="196" width="219" height="153" fill="#E5EDED" stroke="#245E9D" stroke-width="1.2"/><g transform="translate(794,228) scale(0.65)" fill="none" stroke="#245E9D" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-17,-13 L17,-13 M-17,-13 L0,14 M17,-13 L0,14"/><circle cx="-17" cy="-13" r="5"/><circle cx="17" cy="-13" r="5"/><circle cx="0" cy="14" r="5"/></g><text x="820" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#245E9D" text-anchor="start">Engine</text><text x="785" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Execute + account</text><text x="785" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Durable identities</text><path d="M990,268 H999" stroke="#245E9D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M1223,196 l6,6 v153 l-6,-6 Z" stroke="#7260B4" stroke-width="1.2" fill="#D9CFEB" stroke-linejoin="round"/><path d="M1004,349 h219 l6,6 h-219 Z" stroke="#7260B4" stroke-width="1.2" fill="#D9CFEB" stroke-linejoin="round"/><rect x="1004" y="196" width="219" height="153" fill="#EDE8F6" stroke="#7260B4" stroke-width="1.2"/><g transform="translate(1033,228) scale(0.65)" fill="none" stroke="#7260B4" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M0,-22 L19,-13 V1 Q19,16 0,23 Q-19,16 -19,1 V-13 Z M-9,0 l6,7 13,-16"/></g><text x="1059" y="236" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#7260B4" text-anchor="start">Workers</text><text x="1024" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Prove + verify</text><text x="1024" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Scoped witnesses</text><path d="M422,416 l6,6 v137 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M48,553 h374 l6,6 h-374 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><rect x="48" y="416" width="374" height="137" fill="#E5EDED" stroke="#245E9D" stroke-width="1.2"/><text x="68" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#245E9D" text-anchor="start">Authorization</text><text x="68" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Exact plan · amount · recipient</text><text x="68" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Dependencies · deadlines · fees</text><path d="M823,416 l6,6 v137 l-6,-6 Z" stroke="#7260B4" stroke-width="1.2" fill="#D9CFEB" stroke-linejoin="round"/><path d="M449,553 h374 l6,6 h-374 Z" stroke="#7260B4" stroke-width="1.2" fill="#D9CFEB" stroke-linejoin="round"/><rect x="449" y="416" width="374" height="137" fill="#EDE8F6" stroke="#7260B4" stroke-width="1.2"/><text x="469" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#7260B4" text-anchor="start">Disclosure</text><text x="469" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Witness visibility follows the task</text><text x="469" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Native transfers remain public</text><path d="M1224,416 l6,6 v137 l-6,-6 Z" stroke="#658348" stroke-width="1.2" fill="#DDE6CE" stroke-linejoin="round"/><path d="M850,553 h374 l6,6 h-374 Z" stroke="#658348" stroke-width="1.2" fill="#DDE6CE" stroke-linejoin="round"/><rect x="850" y="416" width="374" height="137" fill="#F1F4E8" stroke="#658348" stroke-width="1.2"/><text x="870" y="456" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#658348" text-anchor="start">Recovery</text><text x="870" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Reconcile the accepted operation</text><text x="870" y="515" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Lost reply ≠ permission to repay</text></svg>
