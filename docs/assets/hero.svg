-473V-540Z"/></g></g></g></svg></g><text x="1220" y="66" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#666A60" text-anchor="end" letter-spacing="0.8">WEBANK FINTECHATHON 2026 · TRACK F</text><text x="56" y="179" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="500" fill="#253746" text-anchor="start">One wallet.</text><text x="56" y="251" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="500" fill="#253746" text-anchor="start">Your always-on agent.</text><text x="59" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#666A60" text-anchor="start">Turn financial intent into a plan you can review,</text><text x="59" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#666A60" text-anchor="start">authorize and verify across networks.</text><path d="M864,132 H850 V368 H1215 V132 H941.52" stroke="#245E9D" stroke-width="1.1" fill="none" stroke-linejoin="round"/><text x="872" y="141.12" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="500" fill="#245E9D" text-anchor="start">PAEG</text><circle cx="907" cy="207" r="22" fill="#FFFCF0" stroke="#245E9D" stroke-width="1.7"/><text x="907" y="214" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#245E9D" text-anchor="middle">A</text><circle cx="1040" cy="183" r="22" fill="#FFFCF0" stroke="#245E9D" stroke-width="1.7"/><text x="1040" y="190" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#245E9D" text-anchor="middle">B</text><circle cx="1040" cy="288" r="22" fill="#FFFCF0" stroke="#245E9D" stroke-width="1.7"/><text x="1040" y="295" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#245E9D" text-anchor="middle">C</text><circle cx="1160" cy="239" r="22" fill="#FFFCF0" stroke="#245E9D" stroke-width="1.7"/><text x="1160" y="246" font-family="DejaVu Sans Mono,