" fill="#F1CEB1" stroke-linejoin="round"/><path d="M452,557 h366 l6,6 h-366 Z" stroke="#B85D2E" stroke-width="1.2" fill="#F1CEB1" stroke-linejoin="round"/><rect x="452" y="422" width="366" height="135" fill="#FBE8D7" stroke="#B85D2E" stroke-width="1.2"/><g transform="translate(481,454) scale(0.65)" fill="none" stroke="#B85D2E" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-20,-16 H20 V8 H-2 L-12,17 V8 H-20 Z M-11,-5 h22 M-11,1 h14"/></g><text x="507" y="462" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#B85D2E" text-anchor="start">Persistent intelligence</text><text x="472" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">One conversation. Bounded context.</text><text x="472" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Text, voice, tools and follow-ups.</text><path d="M1214,422 l6,6 v135 l-6,-6 Z" stroke="#7260B4" stroke-width="1.2" fill="#D9CFEB" stroke-linejoin="round"/><path d="M848,557 h366 l6,6 h-366 Z" stroke="#7260B4" stroke-width="1.2" fill="#D9CFEB" stroke-linejoin="round"/><rect x="848" y="422" width="366" height="135" fill="#EDE8F6" stroke="#7260B4" stroke-width="1.2"/><g transform="translate(877,454) scale(0.65)" fill="none" stroke="#7260B4" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M0,-22 L19,-13 V1 Q19,16 0,23 Q-19,16 -19,1 V-13 Z M-9,0 l6,7 13,-16"/></g><text x="903" y="462" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#7260B4" text-anchor="start">Proof-bound execution</text><text x="868" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Scoped witnesses. Durable evidence.</text><text x="868" y="521" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" tex