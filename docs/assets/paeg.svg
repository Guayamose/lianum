<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="639" viewBox="0 0 1280 639" role="img" aria-labelledby="title desc"><title id="title">PAEG evidence and settlement</title><desc id="desc">Four financial nodes contribute scoped proof evidence to conditional settlement. Independent native-chain transactions are not rolled back.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#245E9D"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#B85D2E"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7260B4"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#658348"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A23F2E"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8C6D1F"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222321"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A6A99C"/></marker></defs><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#DCDCCE" opacity="0.55"/></pattern></defs><rect width="1280" height="639" fill="#FFFCF0"/><rect width="1280" height="639" fill="url(#dots)"/><text x="48" y="42" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#666A60" text-anchor="start" letter-spacing="0.8">PRIVATE ATOMIC EXECUTION GRAPHS</text><text x="48" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="500" fill="#222321" text-anchor="start">One signed graph. Evidence for every transition.</text><text x="48" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">A four-node route illustrates the recorded mixed local integration.</text><path d="M300,188 l6,6 v125 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M48,313 h252 l6,6 h-252 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><rect x="48" y="188" width="252" height="125" fill="#E5EDED" stroke="#245E9D" stroke-width="1.2"/><g transform="translate(77,220) scale(0.65)" fill="none" stroke="#245E9D" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-21,-9 H18 M10,-17 l9,8 -9,8 M21,10 H-18 M-10,2 l-9,8 9,8"/></g><text x="103" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#245E9D" text-anchor="start">Uniswap step</text><text x="68" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Prepared venue operation</text><text x="68" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Beneficiary + terms</text><path d="M300,352 l6,6 v125 l-6,-6 Z" stroke="#245E9D" stroke-width="1.2" fill="#CDDEE4" stroke-linejoin="round"/><path d="M48,477 h252 l6,6 h-252 Z" stroke="#245E9