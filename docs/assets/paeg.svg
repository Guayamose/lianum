d" stroke-linecap="round"><path d="M0,-22 L19,-13 V1 Q19,16 0,23 Q-19,16 -19,1 V-13 Z M-9,0 l6,7 13,-16"/></g><text x="755" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#7260B4" text-anchor="start">Scoped proofs</text><text x="720" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Commitment binding</text><text x="720" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Scoped witnesses</text><text x="720" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Single-use nullifiers</text><text x="720" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Verified transitions</text><path d="M933,333 H981" stroke="#658348" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M1224,260 l6,6 v159 l-6,-6 Z" stroke="#658348" stroke-width="1.2" fill="#DDE6CE" stroke-linejoin="round"/><path d="M987,419 h237 l6,6 h-237 Z" stroke="#658348" stroke-width="1.2" fill="#DDE6CE" stroke-linejoin="round"/><rect x="987" y="260" width="237" height="159" fill="#F1F4E8" stroke="#658348" stroke-width="1.2"/><g transform="translate(1016,292) scale(0.65)" fill="none" stroke="#658348" stroke-width="2.77" stroke-linejoin="round" stroke-linecap="round"><path d="M-17,-13 L17,-13 M-17,-13 L0,14 M17,-13 L0,14"/><circle cx="-17" cy="-13" r="5"/><circle cx="17" cy="-13" r="5"/><circle cx="0" cy="14" r="5"/></g><text x="1042" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#658348" text-anchor="start">Settlement</text><text x="1007" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Conditional payout</text><text x="1007" y="359" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Owner change</text><text x="1007" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#666A60" text-anchor="start">Accounted recovery</text><path d="M1224,531 l5,5 v69 l-5,-5 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><path d="M48,600 h1176 l5,5 h-1176 Z" stroke="#A6A99C" stroke-width="1.2" fill="#EFEEE3" stroke-linejoin="round"/><rect x="48" y="531" width="1176" height="69" fill="#FFFCF0" stroke="#A6A99C" stroke-width="1.2"/><text x="70" y="573" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#222321" text-anchor="start">Reserve settlement is conditional. Confirmed native-chain effects remain final.</text></svg>
